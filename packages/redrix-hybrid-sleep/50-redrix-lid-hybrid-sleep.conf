# redrix-hybrid-sleep: closing the lid starts suspend-then-hibernate, which
# ../sleep.conf.d/50-redrix-hybrid-sleep.conf turns into "hybrid sleep after
# 5 minutes". Applies on battery and on AC. Omarchy's own Suspend menu entry
# and idle suspend still do a plain suspend.
[Login]
HandleLidSwitch=suspend-then-hibernate
HandleLidSwitchExternalPower=suspend-then-hibernate
