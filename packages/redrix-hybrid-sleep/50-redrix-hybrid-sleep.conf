# redrix-hybrid-sleep: hybrid sleep after a delay.
#
# suspend-then-hibernate suspends to RAM first. After HibernateDelaySec it wakes
# (RTC alarm), writes a hibernation image, and because HibernateMode=suspend it
# then goes back to RAM sleep instead of powering off. Opening the lid resumes
# from RAM as usual (the image is discarded); if power is lost while asleep, the
# next boot restores the session from the image.
#
# Side effect: `systemctl hibernate` (and Omarchy's menu entry) also stays in
# RAM after writing the image. systemd logs a harmless "Sleep mode 'suspend'
# should not be used by operation hibernate" notice.
#
# Override (e.g. a longer delay) in /etc/systemd/sleep.conf.d/60-local.conf.
[Sleep]
HibernateDelaySec=5min
HibernateMode=suspend
HibernateOnACPower=yes
